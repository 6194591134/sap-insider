# Render setup for The SAP Insider: one web service and one Postgres database.
services:
  - type: web
    name: sap-insider
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npx drizzle-kit push --force && npx tsx server/first-run.ts
    startCommand: npm run start
    healthCheckPath: /api/updates
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sap-insider-db
          property: connectionString

databases:
  - name: sap-insider-db
    plan: basic-256mb
    region: virginia
    diskSizeGB: 1
    postgresMajorVersion: "16"
    databaseName: sap_insider_db
    user: sap_insider_db_user
